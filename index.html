<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0a" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Rushes</title>
    <!-- Le fond et le thème sont posés avant le chargement du bundle : sans cela
         la fenêtre reste sur la couleur par défaut du moteur de rendu le temps
         que React monte, ce qui se voit comme un aplat noir au lancement. -->
    <style>
      :root { color-scheme: light; background: #fbfbfc; }
      :root.dark { color-scheme: dark; background: #08090a; }
      html, body { margin: 0; background: inherit; }
    </style>
    <script>
      (function () {
        var theme = "dark";
        try { theme = localStorage.getItem("rushes-theme") || "dark"; } catch (e) { /* stockage indisponible */ }
        var dark = theme === "dark" || (theme === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.classList.add("dark");
      })();
    </script>
  </head>
  <body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body>
</html>
