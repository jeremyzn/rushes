name: Build Rushes

# Lancement manuel uniquement. Un déclencheur sur tag se retournerait contre nous :
# publier une release crée son tag, ce qui relancerait un build de la version déjà
# distribuée, et tauri-action n'écrit que dans des brouillons.
on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      # Updater JSON is updated by each platform build; serialize them to avoid release-asset races.
      max-parallel: 1
      matrix:
        include:
          - platform: macos-15
            args: "--bundles app,dmg"
            label: "macOS Apple Silicon"
          - platform: windows-latest
            args: "--bundles nsis,msi"
            label: "Windows 10/11 x64"
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Configure signed updater
        run: node scripts/configure-release.mjs
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
      - name: Build and publish installers
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Signature ad-hoc, sans certificat ni compte Apple Developer payant. Elle ne
          # supprime pas l'alerte Gatekeeper, mais scelle le bundle : macOS peut alors
          # dire « développeur non identifié » plutôt que « endommagé », ce qui se
          # contourne d'un clic droit au lieu d'une commande dans le Terminal.
          # Aucun APPLE_CERTIFICATE n'est fourni, donc aucun import de trousseau.
          APPLE_SIGNING_IDENTITY: "-"
          VITE_PROJECT_URL: https://github.com/${{ github.repository }}
        with:
          tagName: v__VERSION__
          releaseName: "Rushes v__VERSION__"
          releaseBody: |
            ## Installation

            **Windows 10/11 x64** : télécharge `Rushes_x64-setup.exe` (ou le `.msi`), lance-le, puis ouvre Rushes depuis le menu Démarrer. Une connexion est requise pendant l'installation, le temps de vérifier le runtime WebView2.

            **macOS Apple Silicon** : télécharge `Rushes_aarch64.dmg`, glisse Rushes dans Applications.

            > **Première ouverture sur macOS.** L'application n'est pas signée par Apple, cette signature exigeant un compte développeur payant. macOS affiche donc « Rushes est endommagé et ne peut pas être ouvert ». L'application n'est pas endommagée : macOS refuse par principe un programme non signé qui vient d'Internet.
            >
            > Glisse d'abord Rushes dans Applications, puis exécute cette commande une seule fois dans le Terminal :
            > ```
            > xattr -cr /Applications/Rushes.app
            > ```
            > Rushes s'ouvre ensuite normalement, y compris après les mises à jour. Le clic droit puis Ouvrir ne suffit pas pour ce message précis.

            Les mises à jour suivantes sont automatiques et signées.

            ## Licence

            Rushes est un logiciel propriétaire. © 2026 ZenoX HQ, tous droits réservés. L'usage des binaires officiels est gratuit et le restera. En revanche, la copie du code, le fork, la redistribution et le rebranding sont interdits. Voir [LICENSE](https://github.com/jeremyzn/rushes/blob/main/LICENSE) et les [notices tierces](https://github.com/jeremyzn/rushes/blob/main/THIRD-PARTY-NOTICES.md).
          releaseDraft: true
          prerelease: false
          retryAttempts: 2
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }} --config src-tauri/tauri.release.conf.json
