name: Build Rushes

# Lancement manuel uniquement. Un déclencheur sur tag se retournerait contre nous :
# publier une release crée son tag, ce qui relancerait un build de la version déjà
# distribuée, et tauri-action n'écrit que dans des brouillons.
on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      # Updater JSON is updated by each platform build; serialize them to avoid release-asset races.
      max-parallel: 1
      matrix:
        include:
          - platform: macos-15
            args: "--bundles app,dmg"
            label: "macOS Apple Silicon"
          - platform: windows-latest
            args: "--bundles nsis,msi"
            label: "Windows 10/11 x64"
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Configure signed updater
        run: node scripts/configure-release.mjs
        env:
          TAURI_UPDATER_PUBLIC_KEY: ${{ secrets.TAURI_UPDATER_PUBLIC_KEY }}
      - name: Composer les notes de version
        id: notes
        shell: bash
        run: node scripts/release-notes.mjs
      - name: Build and publish installers
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Signature ad-hoc, sans certificat ni compte Apple Developer payant. Elle ne
          # supprime pas l'alerte Gatekeeper, mais scelle le bundle : macOS peut alors
          # dire « développeur non identifié » plutôt que « endommagé », ce qui se
          # contourne d'un clic droit au lieu d'une commande dans le Terminal.
          # Aucun APPLE_CERTIFICATE n'est fourni, donc aucun import de trousseau.
          APPLE_SIGNING_IDENTITY: "-"
          VITE_PROJECT_URL: https://github.com/${{ github.repository }}
        with:
          tagName: v__VERSION__
          releaseName: "Rushes v__VERSION__"
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          retryAttempts: 2
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }} --config src-tauri/tauri.release.conf.json
      # tauri-action recopie le corps de la release dans latest.json, installation
      # et licence comprises. La fenêtre de mise à jour n'a besoin que des
      # changements, d'autant que les clients antérieurs à 1.0.3 les affichent en
      # brut. Chaque plateforme réécrit latest.json, d'où ce passage à chaque job.
      - name: Alléger les notes du updater
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NOTES_FILE: ${{ steps.notes.outputs.notes-file }}
        run: |
          tag="v$(node -p "require('./package.json').version")"
          dir="$RUNNER_TEMP/updater"
          mkdir -p "$dir"
          gh release download "$tag" --pattern latest.json --dir "$dir" --clobber
          node -e '
            const fs = require("fs");
            const [file, notesFile] = process.argv.slice(1);
            const manifest = JSON.parse(fs.readFileSync(file, "utf8"));
            manifest.notes = fs.readFileSync(notesFile, "utf8").trim();
            fs.writeFileSync(file, JSON.stringify(manifest, null, 2));
          ' "$dir/latest.json" "$NOTES_FILE"
          gh release upload "$tag" "$dir/latest.json" --clobber
